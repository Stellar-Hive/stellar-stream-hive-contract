name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      # too_many_arguments / needless_borrows_for_generic_args are inherent to
      # Soroban's ABI-driven function signatures and client call style.
      - name: Clippy
        run: >
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::too_many_arguments
          -A clippy::needless_borrows_for_generic_args

  docs:
    name: Docs (rustdoc, warnings as errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc with warnings as errors
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  test:
    name: Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace test suite
        run: cargo test --workspace --verbose

  wasm-build:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Build every contract to the real deployment artifact
        run: |
          cargo build --target wasm32v1-none --release \
            -p stellar-stream-hive-vault \
            -p stellar-stream-hive-stream \
            -p stellar-stream-hive-registry
      - name: Report WASM sizes
        run: |
          WASM_DIR="target/wasm32v1-none/release"
          {
            echo "### WASM artifact sizes"
            echo
            echo "| Contract | Size (bytes) |"
            echo "|---|---|"
            for f in stellar_stream_hive_vault stellar_stream_hive_stream stellar_stream_hive_registry; do
              echo "| $f.wasm | $(stat -c%s "$WASM_DIR/$f.wasm") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
