[package]
name = "stellar-stream-hive-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core streaming contract for Stellar Stream Hive: linear, per-ledger token streaming."

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-stream-hive-vault = { path = "../vault", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
